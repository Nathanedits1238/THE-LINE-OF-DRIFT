name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias e compilar Web
        run: |
          npm install
          npm run build

      - name: Configurar Capacitor e Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "The Line of Drift" "com.nathan.lineofdrift" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Compilar o APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: The-Line-Of-Drift-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
